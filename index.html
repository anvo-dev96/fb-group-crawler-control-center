<!doctype html>
<html lang="vi" data-theme="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FB Crawler Control Center</title>
    <link rel="icon" type="image/png" href="/assets/logo.png">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <span class="brand-mark"><img src="/assets/logo.png" alt="" width="18" height="18"></span>
          <div class="brand-copy">
            <span>FB CRAWLER</span>
            <strong>Control Center</strong>
          </div>
        </div>

        <nav class="nav">
          <section>
            <div class="nav-label">TỔNG QUAN</div>
            <button class="nav-item active" data-page="overview"><span>◫</span><b>Tổng quan</b></button>
          </section>

          <section>
            <div class="nav-label">VẬN HÀNH</div>
            <button class="nav-item" data-page="workers"><span>◉</span><b>Worker</b></button>
            <button class="nav-item" data-page="groups"><span>◎</span><b>Nhóm Facebook</b></button>
            <button class="nav-item" data-page="keywords"><span>⌕</span><b>Từ khóa mua hàng</b></button>
          </section>

          <section>
            <div class="nav-label">SẢN PHẨM</div>
            <button class="nav-item" data-page="products"><span>◧</span><b>Kho sản phẩm</b></button>
          </section>

          <section>
            <div class="nav-label">HỆ THỐNG</div>
            <button class="nav-item" data-page="settings"><span>⚙</span><b>Cấu hình</b></button>
          </section>
        </nav>

        <button class="collapse-footer" id="collapseFooter" type="button" aria-label="Collapse sidebar">
          <span class="collapse-footer-icon" aria-hidden="true"></span>
          <span class="collapse-footer-label">Collapse sidebar</span>
        </button>
      </aside>

      <main class="main">
        <header class="topbar">
          <label class="search-box">
            <span>⌕</span>
            <input id="globalSearch" placeholder="Tìm trang, thao tác, dữ liệu...">
            <kbd>Ctrl/⌘ K</kbd>
          </label>

          <div class="status-cluster">
            <span class="status warning"><i></i>Backend chưa kết nối</span>
            <span class="status warning"><i></i>Worker: 0/0</span>
          </div>

          <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme">
            <span>☼</span>
            <span>☾</span>
          </button>
        </header>

        <div id="pageRoot"></div>
      </main>
    </div>

    <template id="overviewTemplate">
      <section class="page">
        <div class="page-head">
          <div>
            <div>
              <div class="eyebrow">TỔNG QUAN</div>
            </div>
            <p>Trang điều phối tổng thể của hệ thống crawler.</p>
          </div>
          <div class="page-actions">
            <button class="btn ghost" type="button">Ngày</button>
          </div>
        </div>

        <div class="kpi-grid">
          <div class="kpi"></div>
          <div class="kpi"></div>
          <div class="kpi"></div>
          <div class="kpi"></div>
          <div class="kpi"></div>
          <div class="kpi"></div>
        </div>

        <div class="overview-alert-strip"></div>

        <div class="grid">
          <article class="panel span-7">
            <div class="panel-head">
              <div>
                <h2>Nhóm cần theo dõi</h2>
                <p>Danh sách nhóm và tình hình quét.</p>
              </div>
            </div>
            <div class="table"></div>
          </article>

          <article class="panel span-5">
            <div class="panel-head">
              <div>
                <h2>Worker theo thời gian thực</h2>
                <p>Hoạt động trong 6 phút gần nhất.</p>
              </div>
            </div>
            <div class="legend">
              <span class="gold">Worker 1</span>
              <span class="green">Worker 2</span>
              <span class="gray">Worker 3</span>
            </div>
            <svg class="chart" viewBox="0 0 420 260" preserveAspectRatio="none" aria-hidden="true">
              <g class="gridlines">
                <line x1="12" y1="40" x2="408" y2="40"></line>
                <line x1="12" y1="100" x2="408" y2="100"></line>
                <line x1="12" y1="160" x2="408" y2="160"></line>
                <line x1="12" y1="220" x2="408" y2="220"></line>
              </g>
              <polyline class="line gold-line" points="12,220 132,170 264,130 408,80"></polyline>
              <polyline class="line green-line" points="12,220 132,190 264,180 408,140"></polyline>
              <polyline class="line gray-line" points="12,220 132,205 264,198 408,196"></polyline>
            </svg>
          </article>

          <article class="panel span-4">
            <div class="panel-head">
              <div>
                <h2>Hoạt động gần đây</h2>
                <p>Log mới nhất từ backend.</p>
              </div>
            </div>
            <ul class="activity-list"></ul>
          </article>

          <article class="panel span-4">
            <div class="panel-head">
              <div>
                <h2>Tài nguyên</h2>
                <p>Nhịp vận hành hiện tại.</p>
              </div>
            </div>
            <div class="resource-grid"></div>
            <div class="storage"></div>
          </article>

          <article class="panel span-4">
            <div class="panel-head">
              <div>
                <h2>Sức khỏe hệ thống</h2>
                <p>Các chỉ báo cần quan tâm.</p>
              </div>
            </div>
            <div class="overview-health-list"></div>
          </article>

          <article class="panel span-12">
            <div class="panel-head">
              <div>
                <h2>Kênh doanh thu</h2>
                <p>Tỷ trọng hoa hồng theo kênh.</p>
              </div>
            </div>
            <div class="channel-list"></div>
          </article>
        </div>
      </section>
    </template>

    <template id="workersTemplate">
      <section class="page">
        <div class="page-head">
          <div>
            <div>
              <div class="eyebrow">WORKER</div>
            </div>
            <p>Quản lý browser, profile và worker đang chạy.</p>
          </div>
          <div class="page-actions">
            <button class="btn ghost" type="button">Làm mới</button>
            <button class="btn primary" type="button">Tạo worker</button>
          </div>
        </div>

        <div class="worker-summary"></div>
        <div class="worker-list"></div>
      </section>
    </template>

    <template id="facebookAccountsTemplate">
      <section class="page">
        <div class="page-head table-page-head">
          <div>
            <div>
              <div class="eyebrow">TÀI KHOẢN FACEBOOK</div>
            </div>
            <p>Danh sách tài khoản, cookie và worker được gán.</p>
          </div>
          <div class="page-actions">
            <button class="btn ghost" type="button">Làm mới</button>
            <button class="btn primary" type="button">Thêm tài khoản</button>
          </div>
        </div>

        <article class="panel">
          <div class="table-toolbar">
            <input class="grow" data-facebook-accounts-search="1" placeholder="Tìm tài khoản, worker, cookie...">
          </div>
          <div class="accounts-table data-table"></div>
          <div class="bulk-bar"></div>
        </article>
      </section>
    </template>

    <template id="groupsTemplate">
      <section class="page">
        <div class="page-head table-page-head">
          <div>
            <div>
              <div class="eyebrow">NHÓM FACEBOOK</div>
            </div>
            <p>Quản lý danh mục nhóm, worker và thông số quét.</p>
          </div>
          <div class="page-actions">
            <button class="btn ghost" type="button">Xuất</button>
            <button class="btn ghost" type="button">Nhập</button>
            <button class="btn ghost" type="button">Loại nhóm</button>
            <button class="btn primary" type="button">Thêm nhóm</button>
          </div>
        </div>

        <div class="groups-summary worker-summary"></div>

        <article class="panel groups-panel">
          <div class="table-toolbar groups-toolbar">
            <div class="segmented"></div>
            <div class="toolbar-actions"></div>
          </div>
          <div class="groups-table data-table"></div>
          <div class="bulk-bar"></div>
        </article>
      </section>
    </template>

    <template id="keywordsTemplate">
      <section class="page">
        <div class="page-head table-page-head">
          <div>
            <div>
              <div class="eyebrow">TỪ KHÓA</div>
            </div>
            <p>Danh sách từ khóa ưu tiên cho pipeline tìm kiếm.</p>
          </div>
          <div class="page-actions">
            <button class="btn ghost" type="button">Nhập</button>
            <button class="btn primary" type="button">Thêm từ khóa</button>
          </div>
        </div>

        <div class="kpi-grid four">
          <div class="kpi"></div>
          <div class="kpi"></div>
          <div class="kpi"></div>
          <div class="kpi"></div>
        </div>

        <article class="panel">
          <div class="table-toolbar">
            <input class="grow" data-keywords-search="1" placeholder="Tìm từ khóa...">
          </div>
          <div class="keyword-table data-table"></div>
          <div class="pagination"></div>
        </article>
      </section>
    </template>

    <template id="productsTemplate">
      <section class="page">
        <div class="page-head table-page-head">
          <div>
            <div>
              <div class="eyebrow">KHO SẢN PHẨM</div>
            </div>
            <p>Kho sản phẩm, comment mẫu và kết quả bị từ chối.</p>
          </div>
          <div class="page-actions">
            <button class="btn ghost" type="button">Loại sản phẩm</button>
            <button class="btn ghost" type="button">Nhập</button>
            <button class="btn primary" type="button">Thêm sản phẩm</button>
          </div>
        </div>

        <div class="products-summary worker-summary"></div>

        <article class="panel">
          <div class="table-toolbar">
            <div class="toolbar-actions">
              <input class="grow" placeholder="Tìm sản phẩm, loại, comment...">
            </div>
          </div>
          <div class="product-table data-table"></div>
          <div class="bulk-bar"></div>
        </article>
      </section>
    </template>

    <template id="pendingTemplate">
      <section class="page">
        <div class="page-head table-page-head">
          <div>
            <div>
              <div class="eyebrow">CHỜ XỬ LÝ</div>
            </div>
            <p>Các keyword và sản phẩm đang đợi xử lý tiếp.</p>
          </div>
          <div class="page-actions">
            <button class="btn ghost" type="button">Xử lý backlog</button>
            <button class="btn primary" type="button">Thêm nhanh</button>
          </div>
        </div>

        <article class="panel">
          <div class="table-toolbar groups-toolbar">
            <div class="segmented"></div>
            <div class="toolbar-actions">
              <input class="grow" placeholder="Tìm keyword backlog...">
            </div>
          </div>
          <div class="pending-table data-table"></div>
        </article>
      </section>
    </template>

    <template id="processingTemplate">
      <section class="page">
        <div class="page-head">
          <div>
            <div>
              <div class="eyebrow">XỬ LÝ</div>
            </div>
            <p>Phễu xử lý từ quét bài đến comment thành công.</p>
          </div>
        </div>

        <div class="kpi-grid four">
          <div class="kpi"></div>
          <div class="kpi"></div>
          <div class="kpi"></div>
          <div class="kpi"></div>
        </div>

        <div class="grid analysis-grid">
          <article class="panel span-7">
            <div class="panel-head">
              <div>
                <h2>Phễu xử lý</h2>
                <p>Chuyển đổi qua từng bước.</p>
              </div>
            </div>
            <div class="funnel"></div>
          </article>

          <article class="panel span-5">
            <div class="panel-head">
              <div>
                <h2>Lý do thất bại</h2>
                <p>Tỷ trọng các nguyên nhân.</p>
              </div>
            </div>
            <ul class="reason-list"></ul>
          </article>
        </div>
      </section>
    </template>

    <template id="historyTemplate">
      <section class="page">
        <div class="page-head table-page-head">
          <div>
            <div>
              <div class="eyebrow">LỊCH SỬ</div>
            </div>
            <p>Lịch sử comment, chờ duyệt và bị từ chối.</p>
          </div>
        </div>

        <article class="panel">
          <div class="table-toolbar">
            <div class="segmented"></div>
            <input class="grow" placeholder="Tìm theo nhóm, sản phẩm, nội dung...">
          </div>
          <div class="history-table data-table"></div>
        </article>
      </section>
    </template>

    <template id="runsTemplate">
      <section class="page">
        <div class="page-head table-page-head">
          <div>
            <div>
              <div class="eyebrow">LƯỢT CHẠY</div>
            </div>
            <p>Theo dõi các phiên chạy và thống kê worker.</p>
          </div>
        </div>

        <article class="panel">
          <div class="table-toolbar groups-toolbar">
            <div class="segmented"></div>
            <div class="toolbar-actions">
              <input class="grow" placeholder="Tìm mã phiên, worker...">
            </div>
          </div>
          <div class="runs-table data-table"></div>
        </article>
      </section>
    </template>

    <template id="revenueTemplate">
      <section class="page">
        <div class="page-head">
          <div>
            <div>
              <div class="eyebrow">DOANH THU</div>
            </div>
            <p>Tổng hợp doanh thu, hoa hồng và top sản phẩm.</p>
          </div>
        </div>

        <div class="kpi-grid">
          <div class="kpi"></div>
          <div class="kpi"></div>
          <div class="kpi"></div>
          <div class="kpi"></div>
          <div class="kpi"></div>
          <div class="kpi"></div>
        </div>

        <div class="grid revenue-grid">
          <article class="panel span-8">
            <div class="panel-head">
              <div>
                <h2>Biến động hoa hồng</h2>
                <p>Dữ liệu 14 ngày gần nhất.</p>
              </div>
            </div>
            <svg class="chart revenue-chart" viewBox="0 0 420 310" preserveAspectRatio="none" aria-hidden="true">
              <g class="gridlines">
                <line x1="12" y1="40" x2="408" y2="40"></line>
                <line x1="12" y1="100" x2="408" y2="100"></line>
                <line x1="12" y1="160" x2="408" y2="160"></line>
                <line x1="12" y1="220" x2="408" y2="220"></line>
                <line x1="12" y1="280" x2="408" y2="280"></line>
              </g>
              <polyline class="line gold-line" points="12,280 132,190 264,145 408,108"></polyline>
            </svg>
          </article>

          <article class="panel span-4">
            <div class="panel-head">
              <div>
                <h2>Top sản phẩm</h2>
                <p>Xếp hạng hoa hồng.</p>
              </div>
            </div>
            <div class="ranking"></div>
          </article>
        </div>
      </section>
    </template>

    <template id="groupPerformanceTemplate">
      <section class="page">
        <div class="page-head table-page-head">
          <div>
            <div>
              <div class="eyebrow">HIỆU SUẤT NHÓM</div>
            </div>
            <p>Đánh giá chất lượng nhóm dựa trên scanned, match và orders.</p>
          </div>
        </div>

        <div class="kpi-grid four">
          <div class="kpi"></div>
          <div class="kpi"></div>
          <div class="kpi"></div>
          <div class="kpi"></div>
        </div>

        <article class="panel">
          <div class="table-toolbar groups-toolbar">
            <div class="segmented"></div>
            <div class="toolbar-actions">
              <input class="grow" placeholder="Tìm tên nhóm, URL...">
            </div>
          </div>
          <div class="performance-table data-table"></div>
        </article>
      </section>
    </template>

    <template id="settingsTemplate">
      <section class="page settings-page">
        <div class="page-head">
          <div>
            <div>
              <div class="eyebrow">CẤU HÌNH</div>
            </div>
            <p>Cấu hình vận hành, AI, Telegram và giao diện.</p>
          </div>
        </div>

        <div class="settings-layout">
          <div class="settings-nav panel">
            <button type="button" data-settings="operations">Vận hành</button>
            <button type="button" data-settings="urls">URL</button>
            <button type="button" data-settings="ai">AI</button>
            <button type="button" data-settings="telegram">Telegram</button>
            <button type="button" data-settings="shortlink">Rút gọn link</button>
            <button type="button" data-settings="appearance">Giao diện</button>
            <button type="button" data-settings="data">Dữ liệu</button>
            <button type="button" data-settings="update">Cập nhật</button>
            <button type="button" data-settings="license">Giấy phép</button>
          </div>
          <div class="settings-content panel" id="settingsContent"></div>
        </div>
      </section>
    </template>

    <script src="/app.js"></script>
  </body>
</html>
